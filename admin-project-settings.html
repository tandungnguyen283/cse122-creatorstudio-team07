<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cài đặt dự án – CreatorStudio</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-role="admin">
<main id="main" class="main">
  <header class="page-head">
    <hgroup>
      <h1>Cài đặt dự án</h1>
      <p>Phân công nhân sự, quy tắc duyệt và lưu trữ dự án.</p>
    </hgroup>
    <div class="actions">
      <label for="projectSelect" class="sr-only">Dự án</label>
      <select id="projectSelect" aria-label="Chọn dự án"></select>
      <button class="btn primary" id="newProject">+ Dự án mới</button>
    </div>
  </header>

  <div id="area"></div>
</main>

<div class="modal-back" id="newModal" role="dialog" aria-modal="true" aria-labelledby="nmTitle">
  <form class="modal" id="newForm" novalidate>
    <h2 id="nmTitle">Dự án mới</h2>
    <div class="field">
      <label for="nName">Tên dự án *</label>
      <input id="nName" type="text" required minlength="5">
      <small class="field-error"></small>
    </div>
    <div class="field">
      <label for="nClient">Khách hàng *</label>
      <select id="nClient" required></select>
      <small class="field-error"></small>
    </div>
    <div class="field">
      <label for="nDeadline">Hạn chót *</label>
      <input id="nDeadline" type="date" required data-future="1">
      <small class="field-error"></small>
    </div>
    <footer class="modal-actions">
      <button type="button" class="btn" data-close>Hủy</button>
      <button type="submit" class="btn primary">Tạo</button>
    </footer>
  </form>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/admin-project-settings.js"></script>
</body>
</html>
