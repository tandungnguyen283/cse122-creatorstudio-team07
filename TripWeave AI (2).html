<style>
/* Layout: header with 4 role tabs, sidebar of that role's screens, one main work area. */
:root{
  --bg:#f3f6f7;--surface:#ffffff;--surface-2:#eaf0f2;--ink:#14232b;--muted:#586a73;--line:#d6e0e4;
  --accent:#0b6e7a;--accent-ink:#ffffff;--accent-soft:#dcf0f2;
  --warn:#85470a;--warn-soft:#fcefd6;--bad:#a5281c;--bad-soft:#fde8e5;--good:#17693a;--good-soft:#ddf2e4;
  --f-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c191e;--surface:#13252c;--surface-2:#1a323b;--ink:#e5eff2;--muted:#93a8b0;--line:#27404a;
  --accent:#55c4d0;--accent-ink:#04252a;--accent-soft:#12393f;
  --warn:#f0b45a;--warn-soft:#3a2c12;--bad:#f39a92;--bad-soft:#3c1a17;--good:#74d09b;--good-soft:#143523;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c191e;--surface:#13252c;--surface-2:#1a323b;--ink:#e5eff2;--muted:#93a8b0;--line:#27404a;
  --accent:#55c4d0;--accent-ink:#04252a;--accent-soft:#12393f;
  --warn:#f0b45a;--warn-soft:#3a2c12;--bad:#f39a92;--bad-soft:#3c1a17;--good:#74d09b;--good-soft:#143523;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:5px;border:2px solid var(--accent-ink);border-radius:50%;border-right-color:transparent}
.roles{display:flex;gap:4px;flex-wrap:wrap}
.roles button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.roles button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.roleopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.roleopts label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.roleopts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.roleopts input{margin-top:4px}
.userbar{display:flex;gap:10px;align-items:center;margin-left:auto}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding-block:20px 40px}
.side{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
.side .who{font-size:.8rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.side button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.side button small{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.side button[aria-current="page"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.head p{color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:.85rem}.mono{font-family:var(--f-mono);font-size:.82rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.icon{padding:3px 8px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.accent{background:var(--accent-soft);color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.lbl{font-size:.85rem;font-weight:600}
input[type=text],input[type=number],input[type=search],input[type=email],input[type=tel],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea{min-height:80px;resize:vertical}
.err{color:var(--bad);font-size:.82rem;min-height:0}
.err:empty{display:none}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:3px 12px;border-radius:99px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item>div{min-width:0}
.list-btn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.list-btn[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.empty{text-align:center;padding:36px 16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:4px}
.banner{padding:10px 14px;border-radius:8px;font-size:.92rem}
.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.good{background:var(--good-soft);color:var(--good)}.banner.info{background:var(--accent-soft);color:var(--accent)}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:8px;height:14px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.7rem}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 40px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{background:var(--surface-2);border-radius:99px;height:12px;overflow:hidden;display:flex}
.bar .fill{background:var(--accent);height:100%}
.bar .fill.b{background:var(--warn)}.bar .fill.c{background:var(--bad)}.bar .fill.g{background:var(--good)}
.bar .n{text-align:right;font-family:var(--f-mono)}
.day{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.day>header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:8px 12px;background:var(--surface-2)}
.day .it{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line)}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.steps li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.steps li.done{color:var(--ink)}.steps li.done::before{background:var(--good);border-color:var(--good)}
.steps li.now{color:var(--accent)}.steps li.now::before{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.now::before{animation:none}}
.scrim{position:fixed;inset:0;background:rgba(5,15,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:560px;margin-top:5vh;display:flex;flex-direction:column;gap:14px}
.toasts{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;max-width:520px}
.foot{border-top:1px solid var(--line);padding-block:14px 28px;color:var(--muted);font-size:.85rem}
.foot .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
details summary{cursor:pointer;font-weight:600}
mark{background:var(--accent-soft);color:var(--accent);padding:0 3px;border-radius:3px}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .side .who{display:none}
  .side button{flex:0 0 auto}
  .split{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:90px 1fr 34px}
}
</style>

/* ---------- Tính toán lịch trình ---------- */
function dist(a,b){var R=6371,r=function(x){return x*Math.PI/180};var dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);var h=Math.pow(Math.sin(dl/2),2)+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.pow(Math.sin(dg/2),2);return 2*R*Math.asin(Math.sqrt(h))*1.3}
function dayMetrics(ids){var ps=ids.map(P).filter(Boolean);var km=0;for(var i=1;i<ps.length;i++)km+=dist(ps[i-1],ps[i]);var visit=0,cost=0;ps.forEach(function(p){visit+=p.hrs;cost+=p.cost});return {km:km,hours:visit+km/25,cost:cost,n:ps.length}}

function balance(trip){
  var lim=PACE[trip.pace||'normal'];
  var rows=trip.days.map(function(d,i){var m=dayMetrics(d.items);m.i=i;m.limit=lim.hours;
    m.level=m.n===0?'empty':(m.hours>m.limit+2||m.km>45)?'bad':(m.hours>m.limit||m.km>30)?'warn':'ok';
    m.over=!!trip.budgetPerDay&&m.cost>trip.budgetPerDay;return m});
  var sug=[];
  rows.forEach(function(r){
    if(r.level!=='warn'&&r.level!=='bad')return;
    var items=trip.days[r.i].items;if(items.length<2)return;
    var first=P(items[0]),far=items[items.length-1],fd=-1;
    items.slice(1).forEach(function(id){var d=dist(first,P(id));if(d>fd){fd=d;far=id}});
    var others=rows.filter(function(o){return o.i!==r.i}).sort(function(a,b){return a.hours-b.hours});
    var target=others.length?others[0].i:-1;
    var after=dayMetrics(items.filter(function(x){return x!==far}));
    sug.push({key:'mv-'+r.i+'-'+far,from:r.i,item:far,to:target,
      why:'Ngày '+(r.i+1)+' dài khoảng '+f1(r.hours)+' giờ và '+f1(r.km)+' km, vượt mức phù hợp với nhịp “'+lim.label+'” ('+lim.hours+' giờ).',
      text:'Chuyển “'+P(far).name+'” sang '+(target>=0?'Ngày '+(target+1):'một ngày mới')+', Ngày '+(r.i+1)+' còn khoảng '+f1(after.hours)+' giờ.'});
  });
  return {rows:rows,sug:sug,lim:lim};
}

function generate(p,sd){
  var pool=S.places.filter(function(x){return x.status==='approved'&&x.city===p.city});
  if(pool.length<2)return {ok:false,msg:'Không đủ dữ liệu để đề xuất.',detail:p.city+' mới có '+pool.length+' địa điểm đã duyệt. Cần ít nhất 2.'};
  if(pool.length<p.days)return {ok:false,msg:'Không đủ dữ liệu để đề xuất.',detail:p.city+' có '+pool.length+' địa điểm đã duyệt, chưa đủ cho '+p.days+' ngày. Thử giảm số ngày.'};
  var per=PACE[p.pace].per,want=Math.min(pool.length,p.days*per);
  var noise=function(i){return sd?((Math.sin(i*12.9898+sd*78.233)*43758.5453)%1+1)%1*2.2:0};
  var scored=pool.map(function(x,i){return {x:x,s:(p.interests.indexOf(x.cat)>=0?3:0)+(x.cost<=p.budget/per?1:0)+noise(i)}});
  scored.sort(function(a,b){return b.s-a.s});
  var chosen=scored.slice(0,want).map(function(o){return o.x});
  var chain=[chosen.shift()];
  while(chosen.length){var last=chain[chain.length-1],bi=0,bd=1e9;chosen.forEach(function(c,i){var d=dist(last,c);if(d<bd){bd=d;bi=i}});chain.push(chosen.splice(bi,1)[0])}
  var base=Math.floor(want/p.days),rem=want%p.days,idx=0,days=[];
  for(var d=0;d<p.days;d++){
    var n=base+(d<rem?1:0),items=[];
    for(var k=0;k<n;k++){
      var pl=chain[idx++],prev=items.length?P(items[items.length-1].id):null,why=[];
      why.push(p.interests.indexOf(pl.cat)>=0?'Khớp sở thích “'+pl.cat+'”':'Thêm để lịch đa dạng');
      if(prev)why.push('Cách điểm trước '+f1(dist(prev,pl))+' km');
      if(pl.cost<=p.budget/per)why.push('Vừa ngân sách');
      items.push({id:pl.id,why:why});
    }
    days.push({items:items});
  }
  return {ok:true,days:days,params:p};
}

/* ---------- AI-3: tóm tắt sở thích ---------- */
function rx(words){return new RegExp('(?<!\\p{L})(?:'+words+')(?!\\p{L})','iu')}
var KW=[['Ẩm thực',rx('ăn uống|ẩm thực|món ăn|quán ăn|ăn')],['Thiên nhiên',rx('thiên nhiên|núi|đồi|săn mây|mây|cảnh đẹp|chụp ảnh')],['Văn hóa',rx('chùa|bảo tàng|lịch sử|văn hóa|phố cổ|di tích')],['Biển & nghỉ dưỡng',rx('biển|nghỉ dưỡng|tắm')],['Làng nghề',rx('gốm|làng nghề|thủ công')],['Mua sắm',rx('mua sắm|chợ|quà')]];
function summarize(text){
  var ev=[],interests=[];
  KW.forEach(function(k){var m=text.match(k[1]);if(m){interests.push(k[0]);ev.push(m[0])}});
  var bm=text.match(/(\d+(?:[.,]\d+)?)\s*(triệu|tr|k|nghìn)(?!\p{L})/iu),budget=null;
  if(bm){var v=parseFloat(bm[1].replace(',','.')),u=bm[2].toLowerCase();budget=Math.round(v*((u==='triệu'||u==='tr')?1e6:1e3));ev.push(bm[0])}
  var gm=text.match(/(\d+)\s*người/i),group=null;if(gm){group=parseInt(gm[1],10);ev.push(gm[0])}
  var mob=text.match(rx('không đi bộ nhiều|người già|cao tuổi|bà ngoại|bà|ông|trẻ em|em bé|bé|con nhỏ'));
  var slow=text.match(rx('nhẹ nhàng|thong thả|chậm|không đi bộ nhiều'));
  var fast=text.match(rx('nhiều điểm|dày|tối đa'));
  var pace='normal',pm=null;
  if(mob||slow){pace='relaxed';pm=(slow||mob)[0]}else if(fast){pace='packed';pm=fast[0]}
  if(pm)ev.push(pm);
  var signals=(interests.length?1:0)+(budget?1:0)+(group?1:0)+(pm?1:0);
  return {interests:interests,budget:budget,group:group,pace:pace,constraints:mob?'Có người cần đi chậm: '+mob[0]:'',evidence:ev,signals:signals,confidence:Math.round(signals/4*100)};
}
function hl(text,ev){var out=esc(text);ev.forEach(function(e){if(!e)return;var s=esc(e);out=out.split(s).join('\u0001'+s+'\u0002')});return out.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>')}

  var txt=worst==='good'?'Lộ trình cân bằng. Không có ngày nào quá dày hoặc quá xa.':worst==='bad'?'Có ngày quá dày hoặc quá xa so với nhịp đã chọn.':'Có ngày cần chú ý.';
  return '<div class="card stack" aria-live="polite"><div class="row sp"><strong>Cân bằng lộ trình (AI)</strong><button class="btn sm" data-act="closeBal" data-id="'+t.id+'">Ẩn</button></div><div class="banner '+worst+'">'+txt+'</div>'+
   (sug.length?sug.map(function(s){return '<div class="item"><div><strong>'+esc(s.text)+'</strong><p class="small muted">Vì sao: '+esc(s.why)+'</p></div><div class="row"><button class="btn sm primary" data-act="applySug" data-id="'+t.id+'" data-key="'+esc(s.key)+'">Áp dụng</button><button class="btn sm" data-act="editSug" data-id="'+t.id+'" data-key="'+esc(s.key)+'">Sửa</button><button class="btn sm" data-act="skipSug" data-id="'+t.id+'" data-key="'+esc(s.key)+'">Bỏ qua</button></div></div>'}).join(''):'')+
   rep.rows.filter(function(r){return r.level==='empty'}).map(function(r){return '<p class="small">Ngày '+(r.i+1)+' chưa có hoạt động. Thêm địa điểm hoặc xóa ngày.</p>'}).join('')+
   '<p class="small muted">Quy tắc: tổng giờ tham quan cộng di chuyển (25 km/giờ) không vượt '+rep.lim.hours+' giờ với nhịp “'+rep.lim.label+'”, quãng đường dưới 30 km mỗi ngày.</p></div>';

function tripValidate(f,isNew){
  var e={},title=f.elements.title.value.trim(),b=Number(f.elements.budget.value);
  if(title.length<3)e.title='Tên chuyến cần ít nhất 3 ký tự.';

var AI_STEPS=['Đọc sở thích và ngân sách','Chọn địa điểm đã được duyệt','Gom điểm gần nhau theo từng ngày','Kiểm tra ngân sách và nhịp độ'];
function vAI(){
  var a=U.ai,body='';
  if(a.phase==='form')body=aiForm();

  else body=aiResult();
  return head('Tạo lịch trình bằng AI','Nhập sở thích, AI đề xuất lịch theo ngày kèm lý do. Bạn chấp nhận, sửa hoặc từ chối.')+body;
}
function aiForm(){
  var p=U.ai.p;
  var rq=S.requests.find(function(r){return r.summary&&r.summary.interests&&r.summary.interests.length});
  return '<form class="card stack" data-form="ai" novalidate>'+(rq?'<div class="banner info row sp"><span>Hướng dẫn viên đã tóm tắt sở thích của bạn ('+esc(rq.summary.interests.join(', '))+(rq.summary.budget?', '+vnd(rq.summary.budget)+'/ngày':'')+').</span><button type="button" class="btn sm" data-act="aiPrefill" data-id="'+rq.id+'">Điền vào form</button></div>':'')+'<div class="form">'+
   fld('Thành phố','city',sel('city',cities(),p.city))+fld('Số ngày','days',inp('days','number',p.days,'min="1" max="5"'))+
   fld('Ngân sách mỗi ngày (₫)','budget',inp('budget','number',p.budget,'min="0" step="50000"'))+
   fld('Nhịp độ','pace',sel('pace',Object.keys(PACE).map(function(k){return [k,PACE[k].label+' ('+PACE[k].per+' điểm/ngày)']}),p.pace))+
   '<div class="fld full"><span class="lbl">Sở thích</span><div class="checks">'+activeCats().map(function(c){return '<label><input type="checkbox" name="interests" value="'+esc(c)+'"'+(p.interests.indexOf(c)>=0?' checked':'')+'> '+esc(c)+'</label>'}).join('')+'</div><span class="err" data-err="interests"></span></div></div>'+
   '<div><button class="btn primary" type="submit">Tạo lịch trình</button></div></form>';
}
function aiResult(){
  var a=U.ai,r=a.res,p=a.p,out='<div class="stack"><div class="card stack"><div class="row sp"><div class="stack" style="gap:2px"><h2>'+esc(p.city)+' · '+p.days+' ngày · nhịp '+PACE[p.pace].label+'</h2><span class="small muted">Sở thích: '+esc(p.interests.join(', '))+' · ngân sách '+vnd(p.budget)+'/ngày</span></div>'+tag('Gợi ý từ AI','accent')+'</div>'+
   '<details><summary>Vì sao có kết quả này?</summary><ul class="small muted"><li>Địa điểm khớp sở thích được cộng 3 điểm, chi phí vừa ngân sách mỗi điểm được cộng 1 điểm.</li><li>Chỉ dùng địa điểm đã được quản trị viên duyệt ('+S.places.filter(function(x){return x.status==='approved'&&x.city===p.city}).length+' điểm tại '+esc(p.city)+').</li><li>Các điểm được nối theo khoảng cách gần nhất rồi chia đều cho từng ngày.</li></ul></details></div>';
  var tmp={pace:p.pace,budgetPerDay:p.budget,days:r.days.map(function(d){return {items:d.items.map(function(i){return i.id})}})};
  var rep=balance(tmp);
  out+=r.days.map(function(d,di){var m=rep.rows[di];
    return '<section class="day"><header><strong>Ngày '+(di+1)+'</strong><span class="row small"><span class="mono">'+f1(m.hours)+' giờ · '+f1(m.km)+' km · '+vnd(m.cost)+'</span>'+(m.level==='ok'?tag('Cân bằng','good'):tag('Cần chú ý','warn'))+(m.over?tag('Vượt ngân sách','warn'):'')+'</span></header>'+
     d.items.map(function(it){var pl=P(it.id);return '<div class="it"><div><strong>'+esc(pl.name)+'</strong><div class="small muted">'+esc(pl.cat)+' · '+f1(pl.hrs)+' giờ · '+vnd(pl.cost)+'</div></div><div class="chips">'+it.why.map(function(w){return tag(w,w.indexOf('Khớp')===0?'accent':'')}).join('')+'</div></div>'}).join('')+'</section>'}).join('');
  if(rep.sug.length)out+='<div class="banner warn">AI-2: có ngày hơi dày. Sau khi lưu, dùng “Kiểm tra cân bằng lộ trình” trong Lập lịch trình để áp dụng gợi ý.</div>';
  out+='<div class="row"><button class="btn primary" data-act="aiAccept">Chấp nhận và lưu</button><button class="btn" data-act="aiEdit">Sửa trong Planner</button><button class="btn" data-act="aiRegen">Tạo lại</button><button class="btn danger" data-act="aiReject">Từ chối</button></div></div>';
  return out;
}
function runAI(){
  var a=U.ai;clearTimeout(a.timer);a.phase='processing';a.step=0;a.res=null;render();
  (function tick(){a.timer=setTimeout(function(){
    a.step++;
    if(a.step<AI_STEPS.length){render();tick();return}
    var r=U.simFail?{ok:false,msg:'Không thể xử lý yêu cầu lúc này.',detail:'Dịch vụ AI mô phỏng đang bị lỗi. Bạn có thể thử lại hoặc lập thủ công.'}:generate(a.p,a.seed);
    if(r.ok){a.res=r;a.phase='result'}else{a.err=r;a.phase='error';S.ai.failed++;save()}
    render();
  },480)})();
}
function tripFromAI(){

  var t={id:nid('t'),title:p.city+' '+p.days+' ngày – gợi ý AI',city:p.city,budgetPerDay:p.budget,pace:p.pace,status:'draft',owner:'Minh Anh',note:'',ai:true,days:a.res.days.map(function(d){return {items:d.items.map(function(i){return i.id})}})};
  S.trips.unshift(t);U.selTrip=t.id;return t;
}

function reqCard(r){
  var st=U.ra[r.id]||{phase:'idle'},out='<article class="card stack"><div class="row sp"><strong>'+esc(r.name)+'</strong>'+tag(r.city)+'</div>';
  out+='<p class="small">'+(st.phase==='done'||st.phase==='unsure'?hl(r.text,st.res.evidence):esc(r.text))+'</p>';
  if(r.summary&&st.phase==='idle')out+=sumView(r.summary,'Đã lưu')+'<div class="row"><button class="btn sm" data-act="reqEdit" data-id="'+r.id+'">Sửa tóm tắt</button><button class="btn sm" data-act="reqRun" data-id="'+r.id+'">Tóm tắt lại</button></div>';
  else if(st.phase==='processing')out+='<div aria-busy="true" aria-live="polite" class="stack"><span class="small muted">AI đang đọc yêu cầu…</span><div class="skel"></div><div class="skel" style="width:60%"></div></div>';
  else if(st.phase==='done')out+=sumView(st.res,'Đề xuất từ AI')+'<p class="small muted">Vì sao: các cụm được tô sáng ở trên là căn cứ. Độ chắc chắn '+st.res.confidence+'%.</p><div class="row"><button class="btn sm primary" data-act="reqAccept" data-id="'+r.id+'">Chấp nhận</button><button class="btn sm" data-act="reqEdit" data-id="'+r.id+'">Sửa</button><button class="btn sm" data-act="reqRun" data-id="'+r.id+'">Tạo lại</button><button class="btn sm danger" data-act="reqReject" data-id="'+r.id+'">Từ chối</button></div>';
  else if(st.phase==='unsure')out+='<div class="banner warn" role="alert">AI chưa chắc chắn: yêu cầu quá ngắn, chỉ tìm thấy '+st.res.signals+'/4 thông tin. Độ chắc chắn '+st.res.confidence+'%.</div><div class="row"><button class="btn sm" data-act="reqEdit" data-id="'+r.id+'">Điền thủ công</button><button class="btn sm" data-act="reqRun" data-id="'+r.id+'">Thử lại</button><button class="btn sm" data-act="reqSkip" data-id="'+r.id+'">Bỏ qua</button></div>';
  else if(st.phase==='edit')out+='<form class="stack" data-form="reqEdit" data-id="'+r.id+'" novalidate><div class="form">'+
    fld('Sở thích (cách nhau dấu phẩy)','interests',inp('interests','text',(st.draft.interests||[]).join(', ')),'full')+
    fld('Ngân sách mỗi ngày (₫)','budget',inp('budget','number',st.draft.budget||'','min="0" step="50000"'))+
    fld('Số người','group',inp('group','number',st.draft.group||'','min="1" max="30"'))+
    fld('Nhịp độ','pace',sel('pace',Object.keys(PACE).map(function(k){return [k,PACE[k].label]}),st.draft.pace||'normal'))+
    fld('Lưu ý','constraints',inp('constraints','text',st.draft.constraints||''))+'</div><div class="row"><button class="btn sm primary" type="submit">Lưu tóm tắt</button><button class="btn sm" type="button" data-act="reqSkip" data-id="'+r.id+'">Hủy</button></div></form>';
  else out+='<button class="btn sm primary" data-act="reqRun" data-id="'+r.id+'">Tóm tắt bằng AI</button>';
  return out+'</article>';
}
function sumView(s,label){
  return '<div class="card flat stack"><div class="row sp"><strong class="small">Tóm tắt sở thích</strong>'+tag(label,label==='Đã lưu'?'good':'accent')+'</div><div class="chips">'+(s.interests||[]).map(function(i){return tag(i,'accent')}).join('')+(s.group?tag(s.group+' người'):'')+(s.budget?tag(vnd(s.budget)+'/ngày'):'')+tag('Nhịp '+PACE[s.pace||'normal'].label)+'</div>'+(s.constraints?'<p class="small">'+esc(s.constraints)+'</p>':'')+'</div>';
}

function colPlaces(city,sel){return S.places.filter(function(p){return p.city===city&&p.status!=='rejected'}).map(function(p){return '<label><input type="checkbox" name="places" value="'+p.id+'"'+(sel.indexOf(p.id)>=0?' checked':'')+'> '+esc(p.name)+'</label>'}).join('')}
function colValidate(f){
  var e={},title=f.elements.title.value.trim(),ps=[].slice.call(f.querySelectorAll('input[name=places]:checked')).map(function(x){return x.value});
  if(title.length<3)e.title='Tên cần ít nhất 3 ký tự.';
  if(ps.length<2)e.places='Chọn ít nhất 2 địa điểm.';
  return {e:e,ps:ps,title:title};
}

function fitPanel(t){
  var rq=S.requests.find(function(r){return r.tripId===t.id});if(!rq)return '';
  if(!rq.summary)return '<div class="banner info row sp"><span>Du khách có yêu cầu chưa được tóm tắt, chưa thể đối chiếu sở thích.</span><button class="btn sm" data-act="openDash">Mở Tổng quan</button></div>';
  var checks=fitChecks(t,rq.summary),bad=checks.filter(function(c){return !c.ok}).length;
  return '<div class="card stack"><div class="row sp"><strong>Đối chiếu với sở thích đã tóm tắt (AI-3)</strong>'+tag(bad?bad+' điểm cần xem':'Phù hợp',bad?'warn':'good')+'</div>'+sumView(rq.summary,'Đã lưu')+'<ul class="small" style="margin:0;padding-left:18px">'+checks.map(function(c){return '<li style="color:'+(c.ok?'var(--good)':'var(--warn)')+'">'+esc(c.text)+'</li>'}).join('')+'</ul></div>';
}
function fitChecks(t,s){
  var out=[],cats=[];t.days.forEach(function(d){d.items.forEach(function(id){var p=P(id);if(p&&cats.indexOf(p.cat)<0)cats.push(p.cat)})});
  var miss=(s.interests||[]).filter(function(i){return cats.indexOf(i)<0});
  out.push(miss.length?{ok:false,text:'Chưa có hoạt động thuộc: '+miss.join(', ')+'.'}:{ok:true,text:'Lịch có đủ các nhóm sở thích đã tóm tắt.'});
  if(s.budget){var mx=0;t.days.forEach(function(d){var c=dayMetrics(d.items).cost;if(c>mx)mx=c});out.push(mx>s.budget?{ok:false,text:'Ngày tốn kém nhất khoảng '+vnd(mx)+', vượt ngân sách '+vnd(s.budget)+'/ngày của khách.'}:{ok:true,text:'Chi phí mỗi ngày nằm trong ngân sách của khách.'})}
  var pc=PACE[s.pace||'normal'],over=t.days.filter(function(d){return d.items.length>pc.per}).length;
  out.push(over?{ok:false,text:over+' ngày có nhiều hơn '+pc.per+' điểm, nhanh hơn nhịp “'+pc.label+'” khách cần.'}:{ok:true,text:'Nhịp độ phù hợp với nhu cầu của khách.'});
  return out;
}
function vReview(){
  var fl=U.reviewFilter,list=S.trips.filter(function(t){return fl==='all'?true:fl==='pending'?t.status==='in-review':fl==='done'?(t.status==='booked'||t.status==='completed'):t.status===fl});
  if(!U.selReview||!list.some(function(t){return t.id===U.selReview}))U.selReview=list.length?list[0].id:null;
  var t=U.selReview?T(U.selReview):null;
  return head('Review lịch trình','Duyệt lịch trình của du khách, yêu cầu chỉnh sửa hoặc từ chối kèm lý do.')+
  '<div class="chips" role="group" aria-label="Lọc theo trạng thái">'+[['pending','Chờ duyệt'],['changes-requested','Cần chỉnh sửa'],['approved','Đã duyệt'],['done','Đã chốt / hoàn thành'],['rejected','Từ chối'],['all','Tất cả']].map(function(x){return '<button class="chip" aria-pressed="'+(fl===x[0])+'" data-act="revFilter" data-id="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+
  (list.length?'<div class="split"><div class="stack">'+list.map(function(x){return '<button class="list-btn" data-act="selReview" data-id="'+x.id+'" aria-current="'+(x.id===U.selReview)+'"><strong>'+esc(x.title)+'</strong><span class="row small muted">'+esc(x.owner)+' '+tripTag(x)+'</span></button>'}).join('')+'</div>'+reviewDetail(t)+'</div>'
   :emptyBox('Không có lịch trình','Chưa có lịch trình nào ở trạng thái này.'));
}
function reviewDetail(t){
  var rep=balance(t),rv=U.rev[t.id]||'';
  var out='<div class="stack"><div class="card stack"><div class="row sp"><h2>'+esc(t.title)+'</h2>'+tripTag(t)+'</div><span class="small muted">'+esc(t.owner)+' · '+esc(t.city)+' · ngân sách '+vnd(t.budgetPerDay)+'/ngày · nhịp '+rep.lim.label+'</span></div>';
  out+=rep.sug.length||rep.rows.some(function(r){return r.level!=='ok'})?'<div class="banner warn"><strong>AI cảnh báo:</strong> '+(rep.sug.length?rep.sug.map(function(s){return esc(s.why)}).join(' '):'Có ngày chưa có hoạt động.')+'</div>':'<div class="banner good">AI: lộ trình cân bằng, không có ngày quá dày.</div>';
  if(t.status==='completed'&&t.feedback)out+='<div class="banner good"><strong>Phản hồi sau chuyến: '+t.feedback.rating+'/5 sao.</strong> '+esc(t.feedback.comment||'')+'</div>';
  out+=fitPanel(t);
  out+=t.days.map(function(d,di){var m=rep.rows[di];return '<section class="day"><header><strong>Ngày '+(di+1)+'</strong><span class="mono small">'+f1(m.hours)+' giờ · '+f1(m.km)+' km · '+vnd(m.cost)+'</span></header>'+d.items.map(function(id){var p=P(id);return p?'<div class="it"><strong>'+esc(p.name)+'</strong><span class="small muted">'+esc(p.cat)+' · '+f1(p.hrs)+' giờ</span></div>':''}).join('')+'</section>'}).join('');
  if(t.status==='in-review')out+='<div class="card stack"><div class="fld"><label for="f-rv">Nhận xét của guide</label><textarea id="f-rv" data-input="rv" data-id="'+t.id+'" placeholder="Nhận xét bắt buộc khi yêu cầu chỉnh sửa hoặc từ chối">'+esc(rv)+'</textarea><span class="err" id="rv-err"></span></div><div class="row"><button class="btn primary" data-act="rvApprove" data-id="'+t.id+'">Duyệt</button><button class="btn" data-act="rvChanges" data-id="'+t.id+'">Yêu cầu chỉnh sửa</button><button class="btn danger" data-act="rvReject" data-id="'+t.id+'">Từ chối</button></div></div>';
  else if(t.note)out+='<div class="banner info">Nhận xét: '+esc(t.note)+'</div>';
  return out+'</div>';
}

function modItems(){
  var a=S.places.map(function(p){return {kind:'place',id:p.id,name:p.name,meta:p.city+' · '+p.cat,by:p.by,status:p.status,reason:p.reason||'',ok:'approved'}});
  var b=S.activities.map(function(x){var p=P(x.placeId);return {kind:'act',id:x.id,name:x.name,meta:(p?p.name:'')+' · '+vnd(x.price),by:S.partner.id===x.partnerId?S.partner.name:'Đối tác khác',status:x.status,reason:x.reason||'',ok:'active'}});
  return a.concat(b).filter(function(i){return i.status==='pending'||i.status==='rejected'});
}
function vModeration(){
  var fl=U.modFilter,all=modItems(),list=all.filter(function(i){return fl==='all'||i.status===(fl==='pending'?'pending':'rejected')});

function barRows(rows,cls){var max=Math.max.apply(null,rows.map(function(r){return r[1]}).concat([1]));return '<div class="bars">'+rows.map(function(r){return '<div class="bar"><span>'+esc(r[0])+'</span><div class="track"><div class="fill '+(r[2]||cls||'')+'" style="width:'+Math.round(r[1]/max*100)+'%"></div></div><span class="n">'+r[1]+'</span></div>'}).join('')+'</div>'}
function vAnalytics(){
  var a=S.ai,tot=a.accepted+a.edited+a.rejected,rate=tot?Math.round(a.accepted/tot*100):0;
  var rated=S.trips.filter(function(t){return t.status==='completed'&&t.feedback}),avg=rated.length?rated.reduce(function(x,t){return x+t.feedback.rating},0)/rated.length:0;
  var byStatus=Object.keys(TRIP_ST).map(function(k){return [TRIP_ST[k][0],S.trips.filter(function(t){return t.status===k}).length]});
  var byCat=S.categories.map(function(c){return [c.name,S.places.filter(function(p){return p.cat===c.name&&p.status==='approved'}).length]});
  return head('Thống kê','Tình hình sử dụng nền tảng và hiệu quả của các tính năng AI.')+
  '<div class="grid"><div class="card stat"><span class="muted small">Lịch trình</span><b>'+S.trips.length+'</b></div><div class="card stat"><span class="muted small">Địa điểm đã duyệt</span><b>'+S.places.filter(function(p){return p.status==='approved'}).length+'</b></div><div class="card stat"><span class="muted small">Tỷ lệ chấp nhận gợi ý AI</span><b>'+rate+'%</b></div><div class="card stat"><span class="muted small">Điểm hài lòng sau chuyến</span><b>'+(rated.length?f1(avg)+'/5':'—')+'</b></div><div class="card stat"><span class="muted small">Chờ kiểm duyệt</span><b>'+modItems().filter(function(i){return i.status==='pending'}).length+'</b></div></div>'+
  '<div class="two"><section class="card stack"><h2>Lịch trình theo trạng thái</h2>'+barRows(byStatus)+'</section><section class="card stack"><h2>Địa điểm theo danh mục</h2>'+barRows(byCat,'g')+'</section></div>'+
  '<section class="card stack"><h2>Phản hồi của người dùng với AI</h2>'+barRows([['Chấp nhận',a.accepted,'g'],['Sửa lại',a.edited,'b'],['Từ chối',a.rejected,'c'],['Tạo lại',a.regen],['Gặp lỗi',a.failed,'c']])+'<p class="small muted">Tạo lịch (AI-1): chấp nhận, sửa, từ chối, tạo lại. Cân bằng lộ trình (AI-2): '+a.balance+' lần chạy. Tóm tắt sở thích (AI-3): '+a.summaries+' lần.</p></section>'+
  '<section class="card stack"><div class="row sp"><h2>Ghi chú báo cáo</h2><button class="btn sm primary" data-act="newNote">Thêm ghi chú</button></div>'+
  (S.notes.length?S.notes.map(function(n){return '<div class="item"><div><span class="mono small muted">'+esc(n.date)+'</span><p>'+esc(n.text)+'</p></div><div class="row"><button class="btn sm" data-act="editNote" data-id="'+n.id+'">Sửa</button><button class="btn sm danger" data-act="delNote" data-id="'+n.id+'">Xóa</button></div></div>'}).join(''):emptyBox('Chưa có ghi chú','Ghi lại nhận định để dùng cho báo cáo.'))+'</section>';
}

    var items=t.days[s.from].items;items.splice(items.indexOf(s.item),1);

  /* Đối tác */
  actFilter:function(id){U.actFilter=id;render()},
  newAct:function(){modal('Thêm trải nghiệm',actForm(),{label:'Gửi duyệt',onSubmit:function(f){var e=actValidate(f);if(!setErr(f,e))return false;
    S.activities.unshift({id:nid('ac'),partnerId:S.partner.id,placeId:f.elements.place.value,name:f.elements.name.value.trim(),price:Number(f.elements.price.value),cap:Number(f.elements.cap.value),desc:f.elements.desc.value.trim(),status:'pending',saves:0,reason:''});notify('admin','Trải nghiệm mới “'+f.elements.name.value.trim()+'” chờ kiểm duyệt.');save();render();toast('Đã gửi trải nghiệm chờ quản trị viên duyệt');return true}})},
  editAct:function(id){var a=S.activities.find(function(x){return x.id===id});modal(a.status==='rejected'?'Sửa và gửi lại':'Sửa trải nghiệm',actForm(a),{label:a.status==='rejected'?'Gửi lại để duyệt':'Lưu',onSubmit:function(f){var e=actValidate(f);if(!setErr(f,e))return false;
    a.name=f.elements.name.value.trim();a.placeId=f.elements.place.value;a.price=Number(f.elements.price.value);a.cap=Number(f.elements.cap.value);a.desc=f.elements.desc.value.trim();if(a.status==='rejected'){a.status='pending';a.reason='';notify('admin','Trải nghiệm “'+a.name+'” được gửi lại để duyệt.')}save();render();toast('Đã lưu trải nghiệm');return true}})},
  actState:function(id,b){var a=S.activities.find(function(x){return x.id===id});a.status=b.dataset.to;save();render();toast('Đã chuyển sang “'+ACT_ST[a.status][0]+'”')},
  delAct:function(id){confirmBox('Xóa trải nghiệm','Trải nghiệm và các khách quan tâm liên quan sẽ bị xóa.','Xóa',function(){S.activities=S.activities.filter(function(a){return a.id!==id});S.leads=S.leads.filter(function(l){return l.activityId!==id});save();render();toast('Đã xóa trải nghiệm')})},
  newLead:function(){var acts=myActs().filter(function(a){return a.status!=='archived'});if(!acts.length){toast('Cần có trải nghiệm trước');return}
    modal('Thêm khách quan tâm','<div class="form">'+fld('Tên khách','name',inp('name','text',''))+fld('Số người','party',inp('party','number',2,'min="1" max="50"'))+fld('Trải nghiệm','act',sel('act',acts.map(function(a){return [a.id,a.name]}),acts[0].id),'full')+fld('Ghi chú','note',inp('note','text',''),'full')+'</div>',{label:'Thêm',onSubmit:function(f){
      var e={};if(f.elements.name.value.trim().length<2)e.name='Nhập tên khách.';var n=Number(f.elements.party.value);if(!(n>=1&&Number.isInteger(n)))e.party='Số người từ 1 trở lên.';if(!setErr(f,e))return false;
      S.leads.unshift({id:nid('l'),activityId:f.elements.act.value,name:f.elements.name.value.trim(),party:n,status:'new',note:f.elements.note.value.trim()});save();render();toast('Đã thêm khách');return true}})},
  leadState:function(id,b){S.leads.find(function(l){return l.id===id}).status=b.dataset.to;save();render()},
  delLead:function(id){S.leads=S.leads.filter(function(l){return l.id!==id});save();render();toast('Đã xóa')},
  toggleProfile:function(){var p=S.partner;if(p.active){confirmBox('Tạm ngưng hồ sơ','Bạn sẽ không thể thêm trải nghiệm mới cho đến khi kích hoạt lại.','Tạm ngưng',function(){p.active=false;save();render();toast('Đã tạm ngưng hồ sơ')})}else{p.active=true;save();render();toast('Đã kích hoạt lại hồ sơ')}},
  /* Admin */
  modFilter:function(id){U.modFilter=id;render()},
  modOk:function(id,b){var o=b.dataset.kind==='place'?P(id):S.activities.find(function(x){return x.id===id});o.status=b.dataset.kind==='place'?'approved':'active';notifyOwner(b.dataset.kind,o,true);save();render();toast('Đã duyệt')},
  modNo:function(id,b){var kind=b.dataset.kind;modal('Từ chối nội dung','<div class="fld"><label for="f-reason">Lý do (gửi cho người đề xuất)</label><textarea id="f-reason" name="reason"></textarea><span class="err" data-err="reason"></span></div>',{label:'Từ chối',danger:true,onSubmit:function(f){
    var v=f.elements.reason.value.trim();if(v.length<10)return setErr(f,{reason:'Nhập lý do ít nhất 10 ký tự.'});
    var o=kind==='place'?P(id):S.activities.find(function(x){return x.id===id});o.status='rejected';o.reason=v;notifyOwner(kind,o,false,v);save();render();toast('Đã từ chối');return true}})},
  modBack:function(id,b){var o=b.dataset.kind==='place'?P(id):S.activities.find(function(x){return x.id===id});o.status='pending';save();render();toast('Đã đưa về chờ duyệt')},
  newCat:function(){modal('Thêm danh mục','<div class="form">'+fld('Tên danh mục','name',inp('name','text','','maxlength="30"'),'full')+'</div>',{label:'Thêm',onSubmit:function(f){var e=catValidate(f.elements.name.value);if(!setErr(f,e))return false;S.categories.push({id:nid('c'),name:f.elements.name.value.trim(),active:true});save();render();toast('Đã thêm danh mục');return true}})},
  editCat:function(id){var c=S.categories.find(function(x){return x.id===id});modal('Đổi tên danh mục','<div class="form">'+fld('Tên danh mục','name',inp('name','text',c.name,'maxlength="30"'),'full')+'</div>',{onSubmit:function(f){var e=catValidate(f.elements.name.value,id);if(!setErr(f,e))return false;var nn=f.elements.name.value.trim();S.places.forEach(function(p){if(p.cat===c.name)p.cat=nn});U.ai.p.interests=U.ai.p.interests.map(function(i){return i===c.name?nn:i});c.name=nn;save();render();toast('Đã đổi tên và cập nhật các địa điểm');return true}})},
  toggleCat:function(id){var c=S.categories.find(function(x){return x.id===id});c.active=!c.active;save();render();toast(c.active?'Đã bật lại':'Đã vô hiệu hóa')},
  delCat:function(id){var c=S.categories.find(function(x){return x.id===id}),n=S.places.filter(function(p){return p.cat===c.name}).length;
    if(n>0){modal('Không thể xóa','<p class="muted">“'+esc(c.name)+'” đang có '+n+' địa điểm. Hãy vô hiệu hóa danh mục thay vì xóa.</p>',{noSubmit:true,cancel:'Đã hiểu'});return}
    confirmBox('Xóa danh mục','Danh mục “'+esc(c.name)+'” chưa có địa điểm và sẽ bị xóa.','Xóa',function(){S.categories=S.categories.filter(function(x){return x.id!==id});save();render();toast('Đã xóa danh mục')})},
  newNote:function(){modal('Ghi chú báo cáo','<div class="fld"><label for="f-text">Nội dung</label><textarea id="f-text" name="text" maxlength="300"></textarea><span class="err" data-err="text"></span></div>',{label:'Lưu',onSubmit:function(f){var v=f.elements.text.value.trim();if(v.length<5)return setErr(f,{text:'Nhập ít nhất 5 ký tự.'});S.notes.unshift({id:nid('n'),date:new Date().toLocaleDateString('vi-VN'),text:v});save();render();toast('Đã thêm ghi chú');return true}})},
  editNote:function(id){var n=S.notes.find(function(x){return x.id===id});modal('Sửa ghi chú','<div class="fld"><label for="f-text">Nội dung</label><textarea id="f-text" name="text" maxlength="300">'+esc(n.text)+'</textarea><span class="err" data-err="text"></span></div>',{onSubmit:function(f){var v=f.elements.text.value.trim();if(v.length<5)return setErr(f,{text:'Nhập ít nhất 5 ký tự.'});n.text=v;save();render();toast('Đã cập nhật ghi chú');return true}})},
  delNote:function(id){confirmBox('Xóa ghi chú','Ghi chú sẽ bị xóa.','Xóa',function(){S.notes=S.notes.filter(function(n){return n.id!==id});save();render();toast('Đã xóa ghi chú')})}
};
function actValidate(f){var e={};if(f.elements.name.value.trim().length<5)e.name='Tên cần ít nhất 5 ký tự.';
  if(!f.elements.place.value)e.place='Chọn địa điểm.';
  var pr=Number(f.elements.price.value);if(!(pr>=50000&&pr<=20000000))e.price='Giá từ 50.000₫ đến 20.000.000₫.';
  var c=Number(f.elements.cap.value);if(!(c>=1&&c<=100&&Number.isInteger(c)))e.cap='Sức chứa là số nguyên từ 1 đến 100.';
  if(f.elements.desc.value.trim().length<10)e.desc='Mô tả cần ít nhất 10 ký tự.';return e}
function catValidate(v,selfId){var e={},n=v.trim();if(n.length<2)e.name='Tên cần ít nhất 2 ký tự.';
  else if(S.categories.some(function(c){return c.id!==selfId&&norm(c.name)===norm(n)}))e.name='Danh mục này đã tồn tại.';return e}

/* ---------- Sự kiện ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='closeModal'&&b.classList.contains('scrim')&&e.target!==b)return;
  var fn=A[b.dataset.act];if(fn)fn(b.dataset.id,b,e);
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.dataset&&t.dataset.change;if(!k)return;
  if(k==='loginRole'){U.loginRole=t.value;$('#f-email').value=ROLES[t.value].email;$('#f-password').value='demo123';$('#login-err').hidden=true}
  else if(k==='fcity'){U.f.city=t.value;render()}
  else if(k==='fsort'){U.f.sort=t.value;render()}
  else if(k==='fwish'){U.f.wish=t.checked;render()}
  else if(k==='simFail'){U.simFail=t.checked;toast(t.checked?'AI sẽ báo lỗi ở lần chạy tới':'AI hoạt động bình thường')}
  else if(k==='leadFilter'){U.leadFilter=t.value;render()}
  else if(k==='mvDay'){if(t.value==='')return;var tr=T(t.dataset.id),it=tr.days[Number(t.dataset.day)].items,id=it.splice(Number(t.dataset.i),1)[0];tr.days[Number(t.value)].items.push(id);save();render()}
  else if(k==='atTrip'){var tr2=T(t.value),ds=$('#f-day');ds.innerHTML=tr2.days.map(function(_,i){return '<option value="'+i+'">Ngày '+(i+1)+'</option>'}).join('')}
  else if(k==='colCity'){var c=$('#colPlaces');c.innerHTML=colPlaces(t.value,[])}
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset&&t.dataset.input;if(!k)return;
  if(k==='q'){U.f.q=t.value;if(!U.loading)$('#results').innerHTML=resultsHTML()}
  else if(k==='rv'){U.rev[t.dataset.id]=t.value}
});
document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  if(f.id==='mform'){if(M&&M.onSubmit){var r=M.onSubmit(f);if(r!==false&&r!==undefined&&r!==null)closeModal();else if(r===true)closeModal()}return}
  var k=f.dataset.form;
  if(k==='login'){
    var le=f.elements,er0={},role=U.loginRole,em=le.email.value.trim(),pw=le.password.value,box=$('#login-err');box.hidden=true;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))er0.email='Email chưa đúng định dạng.';
    if(pw.length<6)er0.password='Mật khẩu cần ít nhất 6 ký tự.';
    if(!setErr(f,er0))return;
    var btn=$('#login-btn');btn.disabled=true;btn.textContent='Đang đăng nhập…';
    setTimeout(function(){
      if(em.toLowerCase()===ROLES[role].email&&pw==='demo123'){U.user={role:role,name:ROLES[role].who};go(role);toast('Xin chào '+ROLES[role].who)}
      else{btn.disabled=false;btn.textContent='Đăng nhập';box.textContent='Email hoặc mật khẩu không khớp với vai trò '+ROLES[role].label+'. Dùng tài khoản mẫu bên dưới.';box.hidden=false}
    },700);
    return;
  }
  if(k==='ai'){
    var el=f.elements,errs={},days=Number(el.days.value),bud=Number(el.budget.value);
    var ints=[].slice.call(f.querySelectorAll('input[name=interests]:checked')).map(function(x){return x.value});
    if(!(days>=1&&days<=5&&Number.isInteger(days)))errs.days='Số ngày là số nguyên từ 1 đến 5.';
    if(!(bud>=200000&&bud<=10000000))errs.budget='Ngân sách từ 200.000₫ đến 10.000.000₫ mỗi ngày.';
    if(!ints.length)errs.interests='Chọn ít nhất một sở thích.';
    if(!setErr(f,errs))return;
    U.ai.p={city:el.city.value,days:days,budget:bud,pace:el.pace.value,interests:ints};U.ai.seed=0;runAI();
  }else if(k==='profile'){
    var el2=f.elements,er={},ph=el2.phone.value.replace(/\s/g,'');
    if(el2.name.value.trim().length<3)er.name='Tên đơn vị cần ít nhất 3 ký tự.';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el2.email.value.trim()))er.email='Email chưa đúng định dạng.';
    if(!/^0\d{9}$/.test(ph))er.phone='Số điện thoại gồm 10 chữ số, bắt đầu bằng 0.';
    if(el2.desc.value.trim().length<20)er.desc='Giới thiệu cần ít nhất 20 ký tự.';
    if(!setErr(f,er))return;
    var p=S.partner;p.name=el2.name.value.trim();p.email=el2.email.value.trim();p.phone=ph;p.city=el2.city.value;p.langs=el2.langs.value.trim();p.desc=el2.desc.value.trim();save();render();toast('Đã lưu hồ sơ');
  }else if(k==='reqEdit'){
    var el3=f.elements,e3={},id=f.dataset.id,r=S.requests.find(function(x){return x.id===id});
    var list=el3.interests.value.split(',').map(function(s){return s.trim()}).filter(Boolean);
    if(!list.length)e3.interests='Nhập ít nhất một sở thích.';
    var bg=el3.budget.value?Number(el3.budget.value):null;if(bg!==null&&!(bg>=100000))e3.budget='Ngân sách tối thiểu 100.000₫.';
    var gp=el3.group.value?Number(el3.group.value):null;if(gp!==null&&!(gp>=1&&Number.isInteger(gp)))e3.group='Số người là số nguyên từ 1.';
    if(!setErr(f,e3))return;
    r.summary={interests:list,budget:bg,group:gp,pace:el3.pace.value,constraints:el3.constraints.value.trim()};delete U.ra[id];save();render();toast('Đã lưu tóm tắt');
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&M)closeModal()});

render();
})();
</script>
