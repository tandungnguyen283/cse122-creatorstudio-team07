<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 – Không có quyền truy cập</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="center-page" id="main">
  <section class="card state" style="max-width:440px">
    <span class="ico" aria-hidden="true">🔒</span>
    <h1>403 – Không có quyền truy cập</h1>
    <p>Vai trò của bạn không được xem trang này.</p>
    <div class="actions" style="justify-content:center">
      <a class="btn primary" id="homeLink" href="login.html">Về trang của tôi</a>
      <button class="btn" id="logout">Đăng xuất</button>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  const u = CS.session.user();
  if (u) document.getElementById("homeLink").href = CS.ui.HOME[u.role];
  document.getElementById("logout").onclick = () => { CS.session.logout(); location.href = "login.html"; };
</script>
</body>
</html>
