<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý phiên bản – CreatorStudio</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-role="designer">
<main id="main" class="main">
  <header class="page-head">
    <hgroup>
      <h1>Quản lý phiên bản</h1>
      <p>Tạo phiên bản mới, gửi duyệt nội bộ và xử lý góp ý.</p>
    </hgroup>
    <div class="actions">
      <label for="projectSelect" class="sr-only">Dự án</label>
      <select id="projectSelect" aria-label="Chọn dự án"></select>
      <button class="btn primary" id="newVersion">+ Phiên bản mới</button>
    </div>
  </header>

  <search class="toolbar">
    <label for="statusFilter" class="sr-only">Lọc trạng thái</label>
    <select id="statusFilter">
      <option value="">Tất cả (không gồm lưu trữ)</option>
      <option value="draft">Bản nháp</option>
      <option value="review">Chờ review</option>
      <option value="pending">Đang chờ khách duyệt</option>
      <option value="changes">Cần chỉnh sửa</option>
      <option value="approved">Đã duyệt</option>
      <option value="rejected">Bị từ chối</option>
      <option value="archived">Đã lưu trữ</option>
    </select>
  </search>

  <div class="grid" style="grid-template-columns: 1fr 340px; align-items:start" id="vmGrid">
    <section class="card" aria-labelledby="vtTitle">
      <h2 id="vtTitle">Danh sách phiên bản</h2>
      <div id="versionTable"></div>
    </section>
    <section class="card" aria-labelledby="fbTitle">
      <h2 id="fbTitle">Góp ý</h2>
      <p id="fbFor" style="color:var(--muted);font-size:.85rem">Chọn một phiên bản để xem góp ý.</p>
      <div id="fbList"></div>
    </section>
  </div>
</main>

<div class="modal-back" id="versionModal" role="dialog" aria-modal="true" aria-labelledby="vmTitle2">
  <form class="modal" id="versionForm" novalidate>
    <h2 id="vmTitle2">Phiên bản mới</h2>
    <div class="field">
      <label for="vNote">Ghi chú thay đổi *</label>
      <textarea id="vNote" required minlength="10" style="min-height:80px" placeholder="Bạn đã thay đổi gì so với bản trước?"></textarea>
      <small class="field-error"></small>
    </div>
    <div class="field">
      <label for="vColor">Màu đại diện bản xem trước</label>
      <input id="vColor" type="color" value="#6b8f71" style="width:80px;height:40px;padding:2px">
    </div>
    <footer class="modal-actions">
      <button type="button" class="btn" data-close>Hủy</button>
      <button type="submit" class="btn primary">Lưu</button>
    </footer>
  </form>
</div>

<style>
  @media (max-width: 900px) { #vmGrid { grid-template-columns: 1fr !important; } }
  tr.sel td { background: var(--brand-soft); }
</style>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/designer-version-management.js"></script>
</body>
</html>
