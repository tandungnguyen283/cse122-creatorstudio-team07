<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duyệt phiên bản – CreatorStudio</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-role="client">
<main id="main" class="main">
  <header class="page-head">
    <hgroup>
      <h1>Duyệt phiên bản</h1>
      <p>Xem phiên bản mới nhất, góp ý và quyết định duyệt.</p>
    </hgroup>
    <div class="actions">
      <label for="projectSelect" class="sr-only">Dự án</label>
      <select id="projectSelect" aria-label="Chọn dự án"></select>
    </div>
  </header>

  <div class="grid" style="grid-template-columns: 280px 1fr; align-items:start" id="reviewGrid">
    <section aria-labelledby="vlTitle">
      <h2 id="vlTitle">Các phiên bản</h2>
      <div id="versionList"></div>
    </section>
    <section aria-labelledby="vdTitle">
      <h2 id="vdTitle" class="sr-only">Chi tiết phiên bản</h2>
      <div id="versionDetail"></div>
    </section>
  </div>
</main>

<div class="modal-back" id="decisionModal" role="dialog" aria-modal="true" aria-labelledby="decTitle">
  <form class="modal" id="decisionForm" novalidate>
    <h2 id="decTitle">Quyết định</h2>
    <p id="decSummary"></p>
    <div class="field" id="reasonField">
      <label for="decReason">Lý do *</label>
      <textarea id="decReason" minlength="10" style="min-height:80px"></textarea>
      <small class="field-error"></small>
    </div>
    <footer class="modal-actions">
      <button type="button" class="btn" data-close>Hủy</button>
      <button type="submit" class="btn primary" id="decOk">Xác nhận</button>
    </footer>
  </form>
</div>

<style>
  @media (max-width: 800px) { #reviewGrid { grid-template-columns: 1fr !important; } }
  .vitem { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .7rem; margin-bottom: .5rem; cursor: pointer; font: inherit; display: flex; gap: .6rem; align-items: center; }
  .vitem[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
  .vitem .dot { width: 34px; height: 34px; border-radius: 8px; flex: none; }
</style>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/client-review-versions.js"></script>
</body>
</html>
