<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng công việc – CreatorStudio</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-role="lead">
<main id="main" class="main">
  <header class="page-head">
    <hgroup>
      <h1>Bảng công việc</h1>
      <p>Phân công việc cho nhà thiết kế và theo dõi tiến độ.</p>
    </hgroup>
    <div class="actions">
      <label for="projectSelect" class="sr-only">Dự án</label>
      <select id="projectSelect" aria-label="Chọn dự án"></select>
      <button class="btn primary" id="newTask">+ Giao việc</button>
    </div>
  </header>

  <section id="projectDesigner" class="card" aria-labelledby="pdTitle" style="margin-bottom:1rem">
    <h2 id="pdTitle">Nhà thiết kế phụ trách dự án</h2>
    <div class="actions" style="align-items:center">
      <label for="projDesigner" class="sr-only">Nhà thiết kế phụ trách</label>
      <select id="projDesigner"></select>
      <button class="btn sm primary" id="saveDesigner">Gán</button>
      <span id="designerHint" class="hint" style="color:var(--muted)"></span>
    </div>
  </section>

  <section id="briefQueue" class="card" aria-labelledby="bqTitle" style="margin-bottom:1rem">
    <h2 id="bqTitle">Brief chờ duyệt</h2>
    <div id="briefList"></div>
  </section>

  <search class="toolbar">
    <label for="q" class="sr-only">Tìm việc</label>
    <input type="search" id="q" placeholder="Tìm công việc…">
    <label for="assigneeFilter" class="sr-only">Lọc người nhận</label>
    <select id="assigneeFilter"></select>
  </search>

  <div id="board"></div>
</main>

<div class="modal-back" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="tkTitle">
  <form class="modal" id="taskForm" novalidate>
    <h2 id="tkTitle">Giao việc</h2>
    <div class="field">
      <label for="tTitle">Tên công việc *</label>
      <input id="tTitle" type="text" required minlength="5">
      <small class="field-error"></small>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="tAssignee">Người nhận *</label>
        <select id="tAssignee" required></select>
        <small class="field-error"></small>
      </div>
      <div class="field">
        <label for="tPriority">Mức ưu tiên</label>
        <select id="tPriority"><option value="low">Thấp</option><option value="medium" selected>Trung bình</option><option value="high">Cao</option></select>
      </div>
    </div>
    <div class="field">
      <label for="tDue">Hạn *</label>
      <input id="tDue" type="date" required data-future="1">
      <small class="field-error"></small>
    </div>
    <footer class="modal-actions">
      <button type="button" class="btn" data-close>Hủy</button>
      <button type="submit" class="btn primary">Lưu</button>
    </footer>
  </form>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/lead-task-board.js"></script>
</body>
</html>
