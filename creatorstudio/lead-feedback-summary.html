<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng hợp feedback – CreatorStudio</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-role="lead">
<main id="main" class="main">
  <header class="page-head">
    <hgroup>
      <h1>Tổng hợp feedback</h1>
      <p>Chọn góp ý, để AI gom thành việc cần làm rồi giao cho nhà thiết kế.</p>
    </hgroup>
    <div class="actions">
      <label for="projectSelect" class="sr-only">Dự án</label>
      <select id="projectSelect" aria-label="Chọn dự án"></select>
      <label for="versionSelect" class="sr-only">Phiên bản</label>
      <select id="versionSelect" aria-label="Chọn phiên bản"></select>
    </div>
  </header>

  <div class="grid cols-2">
    <section class="card" aria-labelledby="cTitle">
      <header style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;align-items:center">
        <h2 id="cTitle">Góp ý của phiên bản</h2>
        <label class="switch" style="margin:0"><input type="checkbox" id="selectAll"> Chọn tất cả</label>
      </header>
      <div id="commentList"></div>
      <form id="addForm" novalidate style="margin-top:.8rem">
        <div class="field"><label for="newFb">Ghi nhận thêm góp ý (từ chat/email)</label>
        <textarea id="newFb" required minlength="5" style="min-height:60px"></textarea><small class="field-error"></small></div>
        <button class="btn sm" type="submit">Thêm góp ý</button>
      </form>
    </section>

    <section class="ai-panel" aria-labelledby="aiTitle">
      <h3 id="aiTitle"><span aria-hidden="true">✨</span> Feedback Summarizer (AI)</h3>
      <p style="font-size:.9rem">AI chỉ xử lý các góp ý bạn đã chọn.</p>
      <button class="btn primary" id="runAI">Tổng hợp action items</button>
      <div id="aiOut" aria-live="polite"></div>
    </section>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/pages/lead-feedback-summary.js"></script>
</body>
</html>
