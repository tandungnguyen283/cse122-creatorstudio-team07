<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan dự án – CreatorStudio</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-role="client">
<main id="main" class="main">
  <header class="page-head">
    <hgroup>
      <h1>Tổng quan dự án</h1>
      <p>Theo dõi tiến độ, brief và phiên bản mới nhất của từng dự án.</p>
    </hgroup>
    <div class="actions">
      <button class="btn primary" id="newProject">+ Tạo dự án</button>
    </div>
  </header>

  <div class="grid cols-4" id="stats" role="group" aria-label="Thống kê"></div>

  <search class="toolbar" style="margin-top:1rem">
    <label for="q" class="sr-only">Tìm dự án</label>
    <input type="search" id="q" placeholder="Tìm theo tên dự án…">
    <label for="statusFilter" class="sr-only">Lọc trạng thái</label>
    <select id="statusFilter">
      <option value="">Tất cả trạng thái</option>
      <option value="active">Đang chạy</option>
      <option value="paused">Tạm dừng</option>
      <option value="done">Hoàn thành</option>
      <option value="archived">Đã lưu trữ</option>
    </select>
  </search>

  <div id="projectList"></div>
</main>

<div class="modal-back" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
  <form class="modal" id="projectForm" novalidate>
    <h2 id="pmTitle">Tạo dự án</h2>
    <div class="field">
      <label for="pName">Tên dự án *</label>
      <input id="pName" type="text" required minlength="5">
      <small class="field-error"></small>
    </div>
    <div class="field">
      <label for="pDesc">Mô tả *</label>
      <textarea id="pDesc" required minlength="10" style="min-height:80px"></textarea>
      <small class="field-error"></small>
    </div>
    <div class="field">
      <label for="pDeadline">Hạn chót *</label>
      <input id="pDeadline" type="date" required data-future="1">
      <small class="field-error"></small>
    </div>
    <footer class="modal-actions">
      <button type="button" class="btn" data-close>Hủy</button>
      <button type="submit" class="btn primary">Lưu</button>
    </footer>
  </form>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/client-project-overview.js"></script>
</body>
</html>
