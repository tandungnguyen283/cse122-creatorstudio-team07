<!DOCTYPE htl>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – CreatorStudio</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="center-page" id="main">
  <section class="auth-card">
    <a class="brand" href="index.html" style="margin-bottom:1rem"><span class="brand-mark" aria-hidden="true">C</span>CreatorStudio</a>
    <form class="card" id="loginForm" novalidate>
      <h1>Đăng nhập</h1>
      <div id="notice" aria-live="polite"></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" data-type="email" required autocomplete="username">
        <small class="field-error"></small>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" required  autocomplete="current-password">
        <small class="field-error"></small>
      </div>
      <div class="field">
        <label for="role">Vai trò</label>
        <select id="role">
          <option value="">Tự động theo tài khoản</option>
        </select>
        <small class="field-error"></small>
      </div>
      <button class="btn primary" type="submit" id="submitBtn" style="width:100%;justify-content:center">Đăng nhập</button>
    </form>

    <section class="card" id="demoCard">
      <h2>Tài khoản demo</h2>
      <p style="font-size:.85rem;color:var(--muted)">Mật khẩu chung: <code>123456</code>. Bấm để điền nhanh. Email khác sẽ tự tạo tài khoản mới (mật khẩu từ 6 ký tự).</p>
      <div class="actions" id="demoBtns"></div>
      <p style="margin-top:.8rem;margin-bottom:0"><button class="btn sm" id="resetData" type="button">Đặt lại dữ liệu mẫu</button></p>
    </section>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const DEMO_PASSWORD = "123456";

  if (params.get("disabled") === "1") $("notice").innerHTML = '<p class="alert err" role="alert">Tài khoản của bạn đã bị vô hiệu hóa. Hãy liên hệ quản trị viên.</p>';

  const cur = CS.session.user();
  if (cur && cur.status === "active") {
    $("notice").innerHTML = '<p class="alert info">Bạn đang đăng nhập với tên ' + CS.ui.esc(cur.name) + '. <a href="' + CS.ui.HOME[cur.role] + '">Vào trang làm việc</a></p>';
  }

  $("role").insertAdjacentHTML("beforeend", Object.keys(CS.ui.ROLE_LABEL).map((r) => '<option value="' + r + '">' + CS.ui.esc(CS.ui.ROLE_LABEL[r]) + "</option>").join(""));

  const demo = [["client@demo.vn", "Khách hàng"], ["designer@demo.vn", "Nhà thiết kế"], ["lead@demo.vn", "Creative Lead"], ["admin@demo.vn", "Quản trị viên"]];
  $("demoBtns").innerHTML = demo.map(([e, l]) => '<button type="button" class="btn sm" data-email="' + e + '">' + l + "</button>").join("");
  $("demoBtns").onclick = (ev) => {
    const b = ev.target.closest("[data-email]"); if (!b) return;
    $("email").value = b.dataset.email; $("password").value = DEMO_PASSWORD; $("role").value = ""; $("loginForm").querySelectorAll(".field-error").forEach((x) => (x.textContent = "")); $("notice").innerHTML = ""; $("submitBtn").focus();
  };
  $("resetData").onclick = () => { CS.store.reset(); CS.ui.toast("Đã đặt lại dữ liệu mẫu.", "ok"); };

  $("loginForm").onsubmit = (e) => {
    e.preventDefault();
    $("notice").innerHTML = "";
    if (!CS.ui.validate($("loginForm"))) return;
    const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "Đang đăng nhập…";
    setTimeout(() => {
      const email = $("email").value.trim().toLowerCase();
      const pw = $("password").value;
      let u = CS.store.list("users").find((x) => x.email.toLowerCase() === email);
      btn.disabled = false; btn.textContent = "Đăng nhập";
      if (!u) {
        /* Email chưa có: tự tạo tài khoản mới (mật khẩu >= 6 ký tự), vai trò mặc định Khách hàng. */
        u = CS.store.add("users", { name: email.split("@")[0], email: email, role: $("role").value || "client", status: "active", password: pw });
        CS.ui.toast("Đã tạo tài khoản mới cho " + email, "ok");
      } else if (pw !== (u.password || DEMO_PASSWORD)) { $("notice").innerHTML = '<p class="alert err" role="alert">Email hoặc mật khẩu không đúng.</p>'; return; }
      if (u.status !== "active") { $("notice").innerHTML = '<p class="alert err" role="alert">Tài khoản đã bị vô hiệu hóa. Hãy liên hệ quản trị viên.</p>'; return; }
      const role = $("role").value || u.role;
      CS.session.login(u.id, role);
      const next = params.get("next");
      const allowed = CS.ui.NAV[role].some((n) => n[0] === next);
      location.href = allowed ? next : CS.ui.HOME[role];
    }, 600);
  };

})();
</script>
</body>
</html>
